version: 0.0
os: linux

files:
  - source: deploy/image.env
    destination: /opt/redmine-team

  - source: deploy/compose.prod.yaml
    destination: /opt/redmine-team

  - source: deploy/scripts
    destination: /opt/redmine-team/scripts

# Replace deployment-managed configuration left by an initial/manual setup.
file_exists_behavior: OVERWRITE

hooks:
  BeforeInstall:
    - location: deploy/scripts/check_host.sh
      timeout: 300
      runas: root

  AfterInstall:
    - location: deploy/scripts/start.sh
      timeout: 600
      runas: root
  ValidateService:
    - location: deploy/scripts/validate.sh
      timeout: 300
