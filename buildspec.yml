version: 0.2
phases:
  pre_build:
    commands:
      - set -e
      - test -n "$CODEBUILD_RESOLVED_SOURCE_VERSION"
      - export IMAGE_TAG="$(printf '%s' "$CODEBUILD_RESOLVED_SOURCE_VERSION" | cut -c1-12)"
      - export REPO_URI="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_DEFAULT_REGION}.amazonaws.com/${IMAGE_REPO_NAME}"
      - aws ecr get-login-password --region "$AWS_DEFAULT_REGION" | docker login --username AWS --password-stdin "${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_DEFAULT_REGION}.amazonaws.com"
  build:
    commands:
      - docker build -t "$REPO_URI:$IMAGE_TAG" .
      - docker run --rm --entrypoint ruby "$REPO_URI:$IMAGE_TAG" -c plugins/redmine_team_capacity/init.rb
      - docker run --rm --entrypoint ruby "$REPO_URI:$IMAGE_TAG" -c plugins/redmine_team_capacity/app/controllers/team_capacity_controller.rb
      - docker run --rm --entrypoint ruby "$REPO_URI:$IMAGE_TAG" plugins/redmine_team_capacity/test/weekly_hours_test.rb
post_build:
  commands:
    - docker push "$IMAGE_URI"
    - printf 'IMAGE_URI=%s\n' "$IMAGE_URI" > image.env
    - |
      echo "=== ECR Debug Information ==="

      aws sts get-caller-identity

      echo "AWS Region: $AWS_DEFAULT_REGION"
      echo "Repository: $IMAGE_REPO_NAME"
      echo "Image Tag: $IMAGE_TAG"
      echo "Repository URI: $REPO_URI"

      echo "=== Checking existing ECR image ==="

      if aws ecr describe-images \
        --region "$AWS_DEFAULT_REGION" \
        --registry-id "$AWS_ACCOUNT_ID" \
        --repository-name "$IMAGE_REPO_NAME" \
        --image-ids imageTag="$IMAGE_TAG" \
        > /dev/null 2> /tmp/ecr-error.log; then

        echo "SUCCESS: Image already exists."
        echo "Reusing image: $REPO_URI:$IMAGE_TAG"

      elif grep -q 'ImageNotFoundException' /tmp/ecr-error.log; then

        echo "Image does not exist."
        echo "Pushing Docker image..."

        docker push "$REPO_URI:$IMAGE_TAG"

      else

        echo "ERROR: ECR image check failed."
        cat /tmp/ecr-error.log >&2
        exit 1

      fi
      - printf 'IMAGE_URI=%s\n' "$REPO_URI:$IMAGE_TAG" > deploy/image.env
artifacts:
  files:
    - appspec.yml
    - image.env
    - compose.prod.yaml
    - deploy/**/*